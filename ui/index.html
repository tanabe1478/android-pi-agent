<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Android Pi</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>

  <body>
    <main id="app">
      <div id="mode-banner" hidden>ローカルデモ — モデルAPIへは接続していません</div>
      <section id="transcript" aria-label="会話履歴" tabindex="0">
        <header id="app-header" aria-label="pi android client">
          <strong class="logo">pi android client</strong>
          <div class="header-controls">
            <button id="models" type="button" aria-label="モデルを変更" disabled>モデル</button>
            <button id="thinking" type="button" aria-label="思考レベルを変更" disabled>off</button>
          </div>
        </header>
      </section>
      <div id="auth-bar" hidden>
        <span>実モデルを使うには /login</span>
        <button id="login" type="button">ChatGPTログイン</button>
      </div>
      <div id="queue" aria-label="入力キュー" hidden></div>
      <div id="status" role="status" aria-live="polite">接続しています…</div>

      <form id="composer" data-thinking="off">
        <div id="suggestions" aria-label="コマンド候補" hidden></div>
        <div class="editor-frame">
          <label class="sr-only" for="message">メッセージ</label>
          <textarea id="message" rows="2" placeholder="..." disabled></textarea>
          <button id="send" type="submit" disabled>送信</button>
        </div>
      </form>

      <footer aria-label="セッションの状態">
        <div class="footer-info">
          <div class="footer-row location-row">
            <span id="workspace">workspace</span>
            <span aria-hidden="true">•</span>
            <span id="sessions">会話</span>
          </div>
          <div class="footer-row stats-row">
            <span id="usage">↑0 ↓0</span>
          </div>
        </div>
        <button id="settings-open" type="button">設定</button>
      </footer>

      <section id="settings-page" aria-labelledby="settings-title" hidden>
        <div class="settings-header">
          <h1 id="settings-title">設定</h1>
          <button id="settings-back" type="button">戻る</button>
        </div>
        <div id="settings-body"></div>
      </section>

      <dialog id="dialog">
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <button id="dialog-close" type="button">閉じる</button>
      </dialog>
    </main>
  </body>
</html>
